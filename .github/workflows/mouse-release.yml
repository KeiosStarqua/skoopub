name: Build mouse diagnostics

on:
  push:
    tags:
      - 'mouse-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. mouse-v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build skoopub-mouse.exe
        run: cargo build --release --manifest-path apps/mouse/Cargo.toml

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: apps/mouse/target/release/skoopub-mouse.exe
          generate_release_notes: true
