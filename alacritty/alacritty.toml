# Repo-managed Alacritty config. Installed by configure-alacritty.ps1.
# JetBrainsMono NF keeps Nerd Font icons/Powerline glyphs readable
# in Herdr TUI while matching WezTerm's default JetBrains Mono look.

[font]
size = 12.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono NF"
style = "Regular"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NF"
style = "Bold Italic"

# A small offset adds breathing room without changing the glyph size.
[font.offset]
x = 0
y = 1

[window.padding]
x = 8
y = 8

# Mouse reporting to TUIs (Herdr, lazygit, etc.) works by default.
# Hide the pointer while typing and make right-click paste the selection.
[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Right"
action = "Paste"
