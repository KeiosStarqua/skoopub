# Repo-managed Alacritty config. Installed by configure-alacritty.ps1.
# JetBrainsMono NF keeps Nerd Font icons/Powerline glyphs readable
# in Herdr TUI while matching WezTerm's default JetBrains Mono look.

[font]
size = 12.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono NF"
style = "Regular"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NF"
style = "Bold Italic"

# A small offset adds breathing room without changing the glyph size.
[font.offset]
x = 0
y = 1

[window.padding]
x = 8
y = 8

# Mouse reporting to TUIs (Herdr, lazygit, etc.) works by default. Keep all
# click bindings unset so clicks reach the TUI: Herdr uses left-click to focus
# panes/tabs, drag borders to resize and right-click for its context menu, while
# lazygit uses mouseEvents: true (its default). Shift+click still bypasses TUI
# capture for text selection, and middle-click pastes where supported.
[mouse]
hide_when_typing = true
